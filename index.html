<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>השארת פרטים | ייעוץ משכנתא</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --main: #1f3b5c;
      --main-2: #2f5683;
      --accent: #a9c7e3;
      --accent-soft: #edf3f9;
      --ink: #172233;
      --muted: #687385;
      --line: #e3e7ee;
      --field: #f5f7fa;
    }
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Heebo", Arial, sans-serif;
      color: var(--ink);
      background: #f2f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }
    .bg { position: fixed; inset: 0; overflow: hidden; z-index: -1; pointer-events: none; }
    .bg span { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .5; }
    .bg span:nth-child(1) { width: 520px; height: 520px; background: var(--accent); top: -160px; right: -140px; }
    .bg span:nth-child(2) { width: 460px; height: 460px; background: #cfd8e6; bottom: -180px; left: -120px; }

    .card {
      width: 100%;
      max-width: 580px;
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 1px 2px rgba(23, 34, 51, .04), 0 24px 60px -12px rgba(31, 59, 92, .22);
      padding: 40px;
    }
    h1 { font-size: 30px; font-weight: 800; margin: 0 0 6px; color: var(--main); letter-spacing: -.5px; }
    .sub { margin: 0 0 28px; color: var(--muted); font-size: 16px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 16px; }
    .full { grid-column: 1 / -1; }
    label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 7px; }
    label .req { color: var(--main-2); }
    input:not([type="checkbox"]), select {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      font: inherit;
      font-size: 16px;
      color: var(--ink);
      border: 1.5px solid transparent;
      border-radius: 14px;
      background-color: var(--field);
      transition: border-color .2s, box-shadow .2s, background-color .2s;
    }
    input:not([type="checkbox"]):hover, select:hover { background-color: #eef1f6; }
    input:not([type="checkbox"]):focus, select:focus {
      outline: none;
      background-color: #fff;
      border-color: var(--main-2);
      box-shadow: 0 0 0 4px rgba(169, 199, 227, .4);
    }
    .invalid { border-color: #e05c5c !important; background-color: #fff6f6 !important; }
    .ltr { direction: ltr; text-align: right; }
    /* תיבה נפתחת מעוצבת לבחירת שעה */
    .dd { position: relative; }
    .dd-btn {
      width: 100%; height: 52px; margin: 0; padding: 0 16px;
      display: flex; align-items: center; gap: 10px;
      font: inherit; font-size: 16px; font-weight: 400; color: var(--muted);
      background: var(--field); border: 1.5px solid transparent; border-radius: 14px;
      box-shadow: none; cursor: pointer; text-align: right;
      transition: border-color .2s, box-shadow .2s, background-color .2s;
    }
    .dd-btn:hover { background: #eef1f6; transform: none; }
    .dd-btn:focus-visible, .dd.open .dd-btn {
      outline: none; background: #fff;
      border-color: var(--main-2); box-shadow: 0 0 0 4px rgba(169, 199, 227, .4);
    }
    .dd-btn.has-value { color: var(--ink); font-weight: 500; }
    .dd-btn .clock { color: var(--main-2); flex-shrink: 0; }
    .dd-btn .dd-text { flex: 1; }
    .dd-btn .chev { flex-shrink: 0; color: var(--main); transition: transform .25s; }
    .dd.open .chev { transform: rotate(180deg); }

    .dd-list {
      position: absolute; top: calc(100% + 8px); right: 0; left: 0; z-index: 10;
      margin: 0; padding: 8px; list-style: none;
      background: #fff; border: 1px solid var(--line); border-radius: 18px;
      box-shadow: 0 20px 44px -12px rgba(31, 59, 92, .3);
      opacity: 0; transform: translateY(-6px) scale(.98); transform-origin: top;
      visibility: hidden; transition: opacity .18s, transform .18s, visibility .18s;
    }
    .dd.open .dd-list { opacity: 1; transform: none; visibility: visible; }
    .dd-list li {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; border-radius: 12px; cursor: pointer;
      font-size: 16px; transition: background .15s;
    }
    .dd-list li:hover, .dd-list li.active { background: var(--accent-soft); }
    .dd-list .time { direction: ltr; font-weight: 600; color: var(--ink); min-width: 112px; text-align: right; }
    .dd-list .part {
      font-size: 13px; color: var(--muted);
      background: var(--field); padding: 2px 10px; border-radius: 999px;
    }
    .dd-list li:hover .part, .dd-list li.active .part { background: #fff; }
    .dd-list .tick { margin-inline-start: auto; color: var(--main); opacity: 0; }
    .dd-list li[aria-selected="true"] { background: var(--accent-soft); }
    .dd-list li[aria-selected="true"] .time { color: var(--main); }
    .dd-list li[aria-selected="true"] .tick { opacity: 1; }
    .dd-list .sep { height: 1px; background: var(--line); margin: 6px 8px; padding: 0; pointer-events: none; }

    /* שורת אישור לחזרת יועץ (לא חובה) */
    .consent {
      display: flex; align-items: flex-start; gap: 12px;
      margin-top: 22px; padding: 16px 18px;
      border-radius: 14px; background: var(--accent-soft);
      cursor: pointer; font-size: 15px; font-weight: 500; line-height: 1.5;
    }
    .consent input {
      flex-shrink: 0; width: 22px; height: 22px; margin: 1px 0 0;
      accent-color: var(--main); cursor: pointer;
    }
    .botcheck { display: none; }

    button {
      width: 100%;
      height: 56px;
      margin-top: 24px;
      border: none;
      border-radius: 14px;
      background: var(--main);
      color: #fff;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 10px 24px -8px rgba(31, 59, 92, .55);
      transition: background .2s, transform .15s;
    }
    button:hover { background: var(--main-2); transform: translateY(-1px); }
    button:disabled { opacity: .7; cursor: wait; transform: none; }
    .spinner {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .msg { text-align: center; margin-top: 14px; font-weight: 500; font-size: 15px; min-height: 1.4em; color: #c94040; }
    .secure { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 6px; color: var(--muted); font-size: 13px; }

    .success { display: none; text-align: center; padding: 24px 0 8px; animation: pop .4s ease; }
    .success .check {
      width: 76px; height: 76px; margin: 0 auto 20px; border-radius: 50%;
      background: var(--accent-soft); color: var(--main);
      display: flex; align-items: center; justify-content: center;
    }
    .success h2 { margin: 0 0 8px; color: var(--main); font-size: 26px; }
    .success p { color: var(--muted); margin: 0; font-size: 16px; }
    @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }

    @media (max-width: 560px) {
      body { padding: 20px 12px; align-items: flex-start; }
      .card { border-radius: 22px; padding: 28px 20px; }
      .grid { grid-template-columns: 1fr; }
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><span></span><span></span></div>

  <main class="card">
    <form id="form" novalidate>
      <h1>השארת פרטים</h1>
      <p class="sub">מלאו את הפרטים ונחזור אליכם בשעה שנוחה לכם</p>

      <div class="grid">
        <div class="full">
          <label for="fullName">שם מלא <span class="req">*</span></label>
          <input id="fullName" name="fullName" required autocomplete="name" />
        </div>
        <div>
          <label for="idNum">תעודת זהות <span class="req">*</span></label>
          <input id="idNum" name="idNum" required inputmode="numeric" maxlength="9" placeholder="9 ספרות" />
        </div>
        <div>
          <label for="phone">טלפון נייד <span class="req">*</span></label>
          <input id="phone" name="phone" type="tel" class="ltr" required inputmode="tel" autocomplete="tel" placeholder="050-0000000" />
        </div>
        <div class="full">
          <label id="timeLabel" for="timeBtn">שעה נוחה לחזרה <span class="req">*</span></label>
          <div class="dd" id="dd">
            <input type="hidden" id="time" name="time" />
            <button type="button" class="dd-btn" id="timeBtn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="timeLabel timeBtn">
              <svg class="clock" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
              <span class="dd-text" id="timeText">בחרו טווח שעות</span>
              <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <ul class="dd-list" id="timeList" role="listbox" aria-labelledby="timeLabel" tabindex="-1"></ul>
          </div>
        </div>
      </div>

      <label class="consent">
        <input type="checkbox" id="advisor" name="advisor" />
        <span>אני מעוניין/ת שיועץ יחזור אליי לבדיקת המשכנתא שלי</span>
      </label>

      <input type="checkbox" class="botcheck" name="botcheck" tabindex="-1" autocomplete="off" />

      <button type="submit" id="submit">
        <span>שליחה</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
      <div class="msg" id="msg" role="alert"></div>
      <div class="secure">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        הפרטים שלכם נשמרים בדיסקרטיות
      </div>
    </form>

    <div class="success" id="success">
      <div class="check">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <h2>הפרטים נשלחו בהצלחה!</h2>
      <p>תודה, נחזור אליכם בשעה שבחרתם.</p>
    </div>
  </main>

  <script>
    // המפתח שמתקבל במייל מ-web3forms.com
    const ACCESS_KEY = "4d244238-d9ce-4da4-8b04-121606735029";

    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("submit");
    const fields = ["fullName", "idNum", "phone", "time"].map((id) => document.getElementById(id));
    const btnHTML = btn.innerHTML;
    // לשדה השעה (מוסתר) הסימון והפוקוס עוברים לכפתור התיבה
    const ui = (f) => (f.id === "time" ? timeBtn : f);

    fields.forEach((f) => f.addEventListener("input", () => ui(f).classList.remove("invalid")));

    // ---- תיבה נפתחת לבחירת שעה ----
    const dd = document.getElementById("dd");
    const timeBtn = document.getElementById("timeBtn");
    const timeText = document.getElementById("timeText");
    const timeList = document.getElementById("timeList");
    const timeInput = document.getElementById("time");
    const SLOTS = [
      ["08:00 - 10:00", "בוקר"],
      ["10:00 - 12:00", "בוקר"],
      ["12:00 - 14:00", "צהריים"],
      ["14:00 - 16:00", "אחה״צ"],
      ["16:00 - 18:00", "אחה״צ"],
      ["18:00 - 20:00", "ערב"],
      ["כל שעה", "גמיש"],
    ];
    const tick = '<svg class="tick" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    SLOTS.forEach(([value, part], i) => {
      if (i === SLOTS.length - 1) timeList.insertAdjacentHTML("beforeend", '<li class="sep" role="presentation"></li>');
      const li = document.createElement("li");
      li.id = "slot" + i;
      li.setAttribute("role", "option");
      li.setAttribute("aria-selected", "false");
      li.dataset.value = value;
      li.innerHTML = `<span class="time">${value}</span><span class="part">${part}</span>${tick}`;
      li.addEventListener("click", () => choose(li));
      li.addEventListener("mousemove", () => setActive(li));
      timeList.appendChild(li);
    });
    const opts = [...timeList.querySelectorAll('[role="option"]')];
    let active = -1;

    function setActive(li) {
      opts.forEach((o) => o.classList.remove("active"));
      active = opts.indexOf(li);
      if (li) {
        li.classList.add("active");
        timeBtn.setAttribute("aria-activedescendant", li.id);
        li.scrollIntoView({ block: "nearest" });
      }
    }
    function openDd() {
      dd.classList.add("open");
      timeBtn.setAttribute("aria-expanded", "true");
      setActive(opts.find((o) => o.getAttribute("aria-selected") === "true") || opts[0]);
    }
    function closeDd() {
      dd.classList.remove("open");
      timeBtn.setAttribute("aria-expanded", "false");
      timeBtn.removeAttribute("aria-activedescendant");
    }
    function choose(li) {
      opts.forEach((o) => o.setAttribute("aria-selected", String(o === li)));
      timeInput.value = li.dataset.value;
      timeText.textContent = li.dataset.value;
      timeText.style.direction = /\d/.test(li.dataset.value) ? "ltr" : "";
      timeText.style.textAlign = "right";
      timeBtn.classList.add("has-value");
      timeBtn.classList.remove("invalid");
      closeDd();
      timeBtn.focus();
    }

    timeBtn.addEventListener("click", () => (dd.classList.contains("open") ? closeDd() : openDd()));
    timeBtn.addEventListener("keydown", (e) => {
      const isOpen = dd.classList.contains("open");
      if (["ArrowDown", "ArrowUp"].includes(e.key)) {
        e.preventDefault();
        if (!isOpen) return openDd();
        const next = e.key === "ArrowDown" ? Math.min(active + 1, opts.length - 1) : Math.max(active - 1, 0);
        setActive(opts[next]);
      } else if (isOpen && (e.key === "Enter" || e.key === " ")) {
        e.preventDefault();
        choose(opts[active]);
      } else if (isOpen && (e.key === "Escape" || e.key === "Tab")) {
        closeDd();
      } else if (isOpen && e.key === "Home") {
        e.preventDefault(); setActive(opts[0]);
      } else if (isOpen && e.key === "End") {
        e.preventDefault(); setActive(opts[opts.length - 1]);
      }
    });
    document.addEventListener("click", (e) => { if (!dd.contains(e.target)) closeDd(); });
    // ת.ז - ספרות בלבד
    form.idNum.addEventListener("input", () => (form.idNum.value = form.idNum.value.replace(/\D/g, "")));

    // בדיקת ספרת ביקורת של ת.ז ישראלית
    function validId(id) {
      if (!/^\d{5,9}$/.test(id)) return false;
      id = id.padStart(9, "0");
      let sum = 0;
      for (let i = 0; i < 9; i++) {
        let d = Number(id[i]) * ((i % 2) + 1);
        sum += d > 9 ? d - 9 : d;
      }
      return sum % 10 === 0;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";

      const data = Object.fromEntries(new FormData(form));
      const empty = fields.filter((f) => !f.value.trim());
      empty.forEach((f) => ui(f).classList.add("invalid"));
      if (empty.length) {
        msg.textContent = "נא למלא את כל השדות המסומנים בכוכבית";
        ui(empty[0]).focus();
        return;
      }
      if (!validId(data.idNum)) {
        form.idNum.classList.add("invalid");
        msg.textContent = "מספר תעודת הזהות אינו תקין";
        form.idNum.focus();
        return;
      }
      const digits = data.phone.replace(/\D/g, "");
      if (!/^05\d{8}$/.test(digits)) {
        form.phone.classList.add("invalid");
        msg.textContent = "נא להזין מספר טלפון נייד תקין";
        form.phone.focus();
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      try {
        const res = await fetch("https://api.web3forms.com/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({
            access_key: ACCESS_KEY,
            subject: `ליד חדש - בקשת חזרה: ${data.fullName}`,
            from_name: "טופס השארת פרטים",
            botcheck: form.botcheck.checked,
            "שם מלא": data.fullName,
            "תעודת זהות": data.idNum,
            "טלפון נייד": data.phone,
            "שעה נוחה לחזרה": data.time,
            "מעוניין ביועץ לבדיקת המשכנתא": form.advisor.checked ? "כן" : "לא",
          }),
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok || !json.success) throw new Error("שגיאה בשליחה, נסו שוב");
        form.style.display = "none";
        document.getElementById("success").style.display = "block";
      } catch (err) {
        msg.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.innerHTML = btnHTML;
      }
    });
  </script>
</body>
</html>
